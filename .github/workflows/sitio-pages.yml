name: Publicar sitio en GitHub Pages

# Cada cambio en sitio/ se compila y se publica solo.
# Requisito único: en Settings → Pages, «Source» debe estar en «GitHub Actions».
on:
  push:
    branches: [main]
    paths:
      - 'sitio/**'
      - '.github/workflows/sitio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sitio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
