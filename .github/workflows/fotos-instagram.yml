name: Fotos de Instagram

# Descarga las fotos de cada propiedad desde su publicación de Instagram y las
# deja en la rama fotos-instagram para elegirlas. No toca main ni el sitio.
on:
  push:
    branches: [fotos-instagram]
    paths:
      - 'herramientas/fotos-instagram/**'
      - '.github/workflows/fotos-instagram.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install --quiet pillow numpy opencv-python-headless imageio-ffmpeg
      - name: Descargar fotos
        # El registro va a la rama: desde la nube no se pueden leer los registros de Actions.
        run: |
          mkdir -p fotos
          python herramientas/fotos-instagram/descargar.py 2>&1 | tee fotos/registro.txt
      - name: Guardar las fotos en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -m "Fotos de las propiedades desde Instagram" || echo "sin cambios"
          git push
